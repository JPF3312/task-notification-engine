<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Task Notification Client</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body style="font-family: sans-serif; padding: 20px;">
  <h2>Task Progress Monitor (WebSockets)</h2>
  
  <div>
    <label>Título de la Tarea:</label><br>
    <input type="text" id="taskTitle" value="Generar reporte PDF con WebSockets" style="width: 300px; padding: 5px;"><br><br>
    <button onclick="createTask()" style="padding: 8px 15px;">Enviar Tarea</button>
  </div>

  <hr>

  <h3>Estado en Tiempo Real:</h3>
  <p><b>Job ID:</b> <span id="jobId">-</span></p>
  <p><b>Progreso:</b> <span id="progress">0%</span></p>
  <p><b>Estado:</b> <span id="status">Esperando...</span></p>

  <script>
    const socket = io('http://localhost:4000');

    socket.on('connect', () => {
      console.log('Conectado a Socket.io:', socket.id);
    });

    socket.on('task_progress', (data) => {
      console.log('Evento de progreso recibido:', data);
      document.getElementById('progress').innerText = `${data.progress}%`;
      document.getElementById('status').innerText = data.status;
    });

    async function createTask() {
      const title = document.getElementById('taskTitle').value;
      
      const res = await fetch('http://localhost:4000/api/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, payload: { userId: 1 } })
      });

      const data = await res.json();
      if (data.jobId) {
        document.getElementById('jobId').innerText = data.jobId;
        document.getElementById('status').innerText = 'Agregado a la cola';
        document.getElementById('progress').innerText = '0%';
        
        socket.emit('subscribe_job', data.jobId);
      }
    }
  </script>
</body>
</html>
